if(!S.qQ)return '';
var q=S.qQ,c=q.correct,p=S.idx/S.deck.length*100;
var h='<div class="top-bar"><button class="back" data-a="goMenu">← 戻る</button><span class="cnt">'+(S.idx+1)+' / '+S.deck.length+'</span><span class="stag">✓ '+S.sc.c+'</span></div>'+pb(p);
h+='<div class="qcard"><p class="qlbl">'+(S.qm==='ru2ja'?'日本語は？':'ロシア語は？')+'</p><p class="qq">'+(S.qm==='ru2ja'?disp(c):esc(c.ja))+'</p>';
if(S.qm==='ru2ja'&&S.sr&&c.read)h+='<p class="cread">'+esc(c.read)+'</p>';
if(S.qm==='ru2ja')h+=sk(16);
h+='</div><div class="cgrid">';
q.choices.forEach(function(ch){
var cls='ch';
if(S.qA!==null){if(String(ch.id)===String(c.id))cls+=' ok';else if(String(ch.id)===String(S.qA))cls+=' ng';}
h+='<button class="'+cls+'" data-a="ans" data-id="'+esc(String(ch.id))+'">'+esc(S.qm==='ru2ja'?ch.ja:ch.ru)+'</button>';
});
return h+'</div>';
}
function mResult(){
var p=S.sc.t>0?Math.round(S.sc.c/S.sc.t*100):0;
var em=S.sc.c===S.sc.t?'🏆':S.sc.c>=S.sc.t*0.7?'👏':'💪';
var h='<div class="res"><p class="remo">'+em+'</p><h2 class="rtitle">結果</h2><p class="rscore">'+S.sc.c+'<span style="font-size:24px"> / '+S.sc.t+'</span></p><p class="rpct">'+p+'%</p>';
if(S.rev.length>0){h+='<div class="rvbox"><p class="rvtitle">要復習 ('+S.rev.length+')</p>';S.rev.forEach(function(r){h+='<div class="rvi"><p>'+disp(r)+'</p><p>'+esc(r.ja)+'</p></div>';});h+='</div>';}
return h+'<button class="wbtn bGrn" data-a="goMenu" style="margin-top:10px">メニューへ</button></div>';
}
function mMistakes(){
var h='<div class="top-bar"><button class="back" data-a="goMenu">← 戻る</button><span class="cnt">苦手リスト</span></div>';
if(S.mistakes.length===0){return h+'<div style="text-align:center;padding:40px;color:#555">間違えた語句がここに保存されます</div>';}
h+='<div style="display:flex;gap:8px;margin-bottom:12px">';
h+='<button class="db" style="flex:1;padding:10px;background:#e63946" data-a="stMisFlash" data-fd="ru2ja">🃏 露→日</button>';
h+='<button class="db" style="flex:1;padding:10px;background:#c0392b" data-a="stMisFlash" data-fd="ja2ru">🃏 日→露</button>';
h+='<button class="db" style="flex:1;padding:10px;background:#2a9d8f" data-a="stMisQuiz">🎯 クイズ</button>';
h+='<button class="db" style="flex:1;padding:10px;background:#333;border:1px solid #555" data-a="clearMis">🗑 リセット</button>';
h+='</div><div class="llist">';
S.mistakes.forEach(function(p){
h+='<div class="li"><div class="lih"><span class="licat">'+(p.cat||'')+'</span><div style="display:flex;align-items:center;gap:6px">';
h+='<button class="spk" data-a="spkItem" data-ru="'+esc(p.ru)+'" style="width:29px;height:29px;font-size:13px">🔊</button>';
h+='<button style="background:rgba(244,162,97,.2);border:1px solid #f4a261;color:#f4a261;border-radius:4px;padding:2px 8px;font-size:10px;cursor:pointer" data-a="delMis" data-id="'+esc(String(p.id))+'" data-ru="'+esc(p.ru)+'">削除</button>';
h+='</div></div>';
h+='<p class="liru">'+disp(p)+'</p>'+(S.sr&&p.read?'<p class="liread">'+esc(p.read)+'</p>':'')+'<p class="lija">'+esc(p.ja)+'</p></div>';
});
return h+'</div>';
}
function mReview(){
var f=filt(),dk=null;DK.forEach(function(d){if(d.k===S.dt)dk=d;});
var h='<div class="top-bar"><button class="back" data-a="goMenu">← 戻る</button><span class="cnt">'+(dk?esc(dk.l):'')+'一覧</span></div>'+'<div class="llist">';
f.forEach(function(p){
h+='<div class="li"><div class="lih"><span class="licat">'+esc(p.cat||'')+'</span><div style="display:flex;align-items:center;gap:6px"><button class="spk" data-a="spkItem" data-ru="'+esc(p.ru)+'" style="width:29px;height:29px;font-size:13px">🔊</button><span class="liid">#'+esc(String(p.id))+'</span></div></div>'+'<p class="liru">'+disp(p)+'</p>'+(S.sr&&p.read?'<p class="liread">'+esc(p.read)+'</p>':'')+'<p class="lija">'+esc(p.ja)+'</p></div>';
});
return h+'</div>';
}
function stFlash(dir){S.fd=dir;var f=filt();S.deck=S.sh?shuf(f):f.slice();S.idx=0;S.flip=false;S.mode='flash';render();}
function stQuiz(qm){S.qm=qm;var f=filt();S.deck=S.sh?shuf(f):f.slice();S.idx=0;S.sc={c:0,t:0};S.rev=[];S.qA=null;makeQ(0);S.mode='quiz';render();}
function makeQ(i){
if(i>=S.deck.length){S.mode='result';render();return;}
var correct=S.deck[i],pl=pool(),others=shuf(pl.filter(function(p){return String(p.id)!==String(correct.id);})).slice(0,3);
S.qQ={correct:correct,choices:shuf([correct].concat(others))};S.qA=null;
}
function ans(idStr){
if(S.qA!==null)return;
var q=S.qQ,chosen=null;
q.choices.forEach(function(c){if(String(c.id)===idStr)chosen=c;});
if(!chosen)return;
S.qA=String(chosen.id);
var ok=String(chosen.id)===String(q.correct.id);
S.sc.c+=ok?1:0;S.sc.t++;
if(!ok){S.rev.push(q.correct);addMistake(q.correct);}
render();
var ci=S.idx;setTimeout(function(){S.idx=ci+1;makeQ(S.idx);render();},1200);
}
function skip(){if(S.flip)addMistake(S.deck[S.idx]);S.flip=false;if(S.idx+1>=S.deck.length){S.mode='done';render();return;}S.idx++;render();}
function known(){var c=S.deck[S.idx];var id=c.id;if(S.known.indexOf(id)<0)S.known.push(id);removeMistake(id,c.ru);S.flip=false;if(S.idx+1>=S.deck.length){S.mode='done';render();return;}S.idx++;render();}
function spk(t){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=S.rate;window.speechSynthesis.speak(u);}
document.body.addEventListener('click',function(e){
var el=e.target;
while(el&&el.tagName!=='BODY'){
var a=el.getAttribute('data-a');
if(!a){el=el.parentNode;continue;}
if(a==='spk'){var c=S.deck[S.idx];if(c)spk(c.ru);}
else if(a==='spkItem'){spk(el.getAttribute('data-ru')||'');}
else if(a==='setDT'){S.dt=el.getAttribute('data-v');S.cat='すべて';render();}
else if(a==='setCat'){S.cat=el.getAttribute('data-v');render();}
else if(a==='setPR'){S.rf=el.getAttribute('data-f');S.rt=el.getAttribute('data-t');render();}
else if(a==='togSH'){S.sh=!S.sh;render();}
else if(a==='togSR'){S.sr=!S.sr;render();}
else if(a==='stFlash'){stFlash(el.getAttribute('data-d'));}
else if(a==='stQuiz'){stQuiz(el.getAttribute('data-q'));}
else if(a==='goRev'){S.mode='review';render();}
else if(a==='goMis'){S.mode='mistakes';render();}
else if(a==='stRand10'){var fd=el.getAttribute('data-d')||'ru2ja';stFlash(fd);S.deck=S.deck.slice(0,10);S.mode='flash';render();}
else if(a==='stMisFlash'){if(S.mistakes.length===0)return;S.fd=el.getAttribute('data-fd')||'ru2ja';S.deck=S.sh?shuf(S.mistakes.slice()):S.mistakes.slice();S.idx=0;S.flip=false;S.known=[];S.mode='flash';render();}
else if(a==='stMisQuiz'){if(S.mistakes.length===0)return;S.deck=S.sh?shuf(S.mistakes.slice()):S.mistakes.slice();S.idx=0;S.qm='ru2ja';S.sc={c:0,t:0};S.rev=[];makeQ(0);S.mode='quiz';render();}
else if(a==='clearMis'){if(confirm('苦手リストをリセットしますか？')){S.mistakes=[];saveMistakes();render();}}
else if(a==='delMis'){removeMistake(el.getAttribute('data-id'),el.getAttribute('data-ru'));render();}
else if(a==='goMenu'){S.mode='menu';render();}
else if(a==='flip'){S.flip=!S.flip;render();}
else if(a==='skip'){skip();}
else if(a==='known'){known();}
else if(a==='ans'){ans(el.getAttribute('data-id'));}
else if(a==='redo'){stFlash(S.fd);}
return;
}
});
document.body.addEventListener('change',function(e){
var a=e.target.getAttribute('data-a');
if(a==='setRF'){S.rf=e.target.value;render();}
else if(a==='setRT'){S.rt=e.target.value;render();}
});
document.body.addEventListener('input',function(e){
var a=e.target.getAttribute('data-a');
if(a==='setRate'){
S.rate=parseFloat(e.target.value);
var l=document.getElementById('sl'),v=document.getElementById('sv');
if(l)l.textContent=spd(S.rate);if(v)v.textContent='('+S.rate+'x)';
}
});
render();
</script>

</body>
</html>
